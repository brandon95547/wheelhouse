<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Import to Wheelhouse</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img src="icons/icon32.png" alt="" width="28" height="28" />
      <div class="header-text">
        <h1>Wheelhouse</h1>
        <p>Import visible eBay sold listings</p>
      </div>
      <button id="settings-toggle" class="icon-button" type="button" aria-expanded="false">
        Settings
      </button>
    </header>

    <!-- Backend URL settings -->
    <section id="settings-panel" class="panel" hidden>
      <label class="label" for="backend-url">Wheelhouse backend URL</label>
      <input
        id="backend-url"
        type="url"
        class="input"
        placeholder="http://localhost:4000"
        spellcheck="false"
      />
      <p class="hint">
        Must match the address the Wheelhouse server is running on. Find it on the
        Settings page in Wheelhouse.
      </p>
      <button id="save-settings" class="button button-secondary" type="button">
        Save backend URL
      </button>
    </section>

    <!-- Page status -->
    <section class="panel">
      <p id="page-status" class="status status-neutral">Checking this tab…</p>
      <p id="page-detail" class="hint" hidden></p>
    </section>

    <!-- Import controls -->
    <section id="import-panel" class="panel" hidden>
      <label class="label" for="category">Wheelhouse category</label>
      <select id="category" class="input">
        <option value="">Loading categories…</option>
      </select>

      <div class="button-row">
        <button id="rescan" class="button button-secondary" type="button">Rescan page</button>
        <button id="import" class="button button-primary" type="button" disabled>
          Import to Wheelhouse
        </button>
      </div>
    </section>

    <!-- Result messages -->
    <section id="result-panel" class="panel" hidden>
      <p id="result-message" class="status" role="status"></p>
      <dl id="result-stats" class="stats" hidden>
        <div><dt>Found</dt><dd id="stat-found">0</dd></div>
        <div><dt>Imported</dt><dd id="stat-imported">0</dd></div>
        <div><dt>Duplicates</dt><dd id="stat-duplicates">0</dd></div>
        <div><dt>Failed</dt><dd id="stat-failed">0</dd></div>
      </dl>
      <details id="result-errors" hidden>
        <summary>Listings that failed validation</summary>
        <ul id="error-list"></ul>
      </details>
    </section>

    <footer class="footer">
      <button id="open-ebay" class="link-button" type="button">
        Open eBay sold listings
      </button>
      <span id="parser-version" class="hint"></span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
